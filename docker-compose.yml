services:
  portal-frontend:
    build: ./portal/frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000  # client-side (browser) only; use portal-backend:8000 for SSR
    depends_on:
      - portal-backend

  portal-backend:
    build: ./portal/backend
    ports:
      - "8000:8000"
    env_file:
      - ./portal/backend/.env
    environment:
      - POSTGRES_URI=postgresql://genbi:genbi_dev_pw@postgres:5432/genbi
      - MONGODB_URI=mongodb://genbi:genbi_dev_pw@mongodb:27017/?authSource=admin
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started

  ops-frontend:
    build: ./ops/frontend
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001  # client-side (browser) only; use ops-backend:8001 for SSR
    depends_on:
      - ops-backend

  ops-backend:
    build: ./ops/backend
    ports:
      - "8001:8001"
    env_file:
      - ./ops/backend/.env
    environment:
      - POSTGRES_URI=postgresql://genbi:genbi_dev_pw@postgres:5432/genbi
      - MONGODB_URI=mongodb://genbi:genbi_dev_pw@mongodb:27017/?authSource=admin
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db

volumes:
  pg-data:
  mongo-data:
